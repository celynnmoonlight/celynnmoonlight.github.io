bio: |
  Celynn Moonlight is a co-founder of Shanghai Sunrise Chime Technology Co., Ltd. and a PhD candidate at the School of Physical Science and Technology, ShanghaiTech University (jointly trained with the Shanghai Institute of Technical Physics, Chinese Academy of Sciences - SITP CAS), under the supervision of Prof. Wei Lu, a distinguished authority in infrared physics and condensed matter physics. Bridging the gap between scientific research and commercial application, she leverages her physics and chemistry background to drive AI-powered software innovation.

  As a multi-disciplinary entrepreneur, Celynn oversees market positioning, brand strategy, and user growth for the company's AI product FlagSay. Her research in solid-state optoelectronics and semiconductor physics deepens her understanding of complex systems, which she applies directly to optimizing the product logic and marketing strategies of AI application software.
